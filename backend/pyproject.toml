[project]
name = "app-financeiro-backend"
version = "0.1.0"
description = "Backend do app de controle financeiro pessoal"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "supabase>=2.7",
    # Declarados explicitamente porque o código importa direto —
    # antes funcionavam só por dependência transitiva (frágil)
    "httpx>=0.27",
    "cryptography>=43",
    "python-dotenv>=1.0",
    "pyjwt[crypto]>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    # Mock de httpx no nível de transporte — valida serialização/headers
    # reais das chamadas à Gmail API sem rede (>=0.22 exigido pelo httpx 0.28)
    "respx>=0.22",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# PEP 8 + import sorting via ruff (substitui flake8 + isort)
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
